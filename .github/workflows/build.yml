name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      versions:
        description: "Space separated Minecraft versions to build (leave empty for all)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"

jobs:
  setup:
    name: Plan build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute matrix
        id: matrix
        env:
          REQUESTED_VERSIONS: ${{ github.event.inputs.versions }}
        run: python3 .github/scripts/build-matrix.py

  build:
    name: Build ${{ matrix.version }}
    needs: setup
    runs-on: ubuntu-latest
    # The 26.4 target is experimental: it becomes buildable once Minecraft 26.4 and the
    # matching jGui / Loom toolchain are released, and until then it must not fail the workflow.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8 (ReplayStudio toolchain)
        id: jdk8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build ${{ matrix.version }}
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.java.installations.paths=${{ steps.jdk8.outputs.path }}"
        run: |
          set +e
          ./gradlew :${{ matrix.version }}:bundleJar --no-daemon --stacktrace 2>&1 | tee gradle.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::Gradle build failed for ${{ matrix.version }} (exit code $status)"
            { grep -m1 -A 25 "What went wrong" gradle.log || tail -n 25 gradle.log; } | sed 's/^/::error::/' | head -n 26
          fi
          exit "$status"

      - name: Collect final jar (${{ matrix.version }})
        if: always()
        run: |
          mkdir -p dist
          find "versions/${{ matrix.version }}/build/libs" -maxdepth 1 -name '*.jar' \
            ! -name '*-raw.jar' ! -name '*-obf.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' \
            -exec cp -v {} dist/ \; || true
          ls -l dist || true

      - name: Upload jar (${{ matrix.version }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.jar
          if-no-files-found: warn
          retention-days: 30

  collect:
    name: Collect all jars
    needs: build
    if: always() && needs.build.result != 'skipped' && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Download all jars
        uses: actions/download-artifact@v4
        with:
          path: jars
          pattern: recapmod-*
          merge-multiple: true

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: recapmod-all
          path: jars/*.jar
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all jars
        uses: actions/download-artifact@v4
        with:
          path: jars
          pattern: recapmod-*
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: jars/*.jar
          generate_release_notes: true
          fail_on_unmatched_files: false
