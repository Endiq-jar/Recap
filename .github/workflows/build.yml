name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      versions:
        description: "Space separated Minecraft versions to build (leave empty for all)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"

jobs:
  setup:
    name: Plan build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute matrix
        id: matrix
        env:
          REQUESTED_VERSIONS: ${{ github.event.inputs.versions }}
        run: python3 .github/scripts/build-matrix.py

  build:
    name: Build ${{ matrix.version }}
    needs: setup
    runs-on: ubuntu-latest
    # The 26.4 target is experimental: it becomes buildable once Minecraft 26.4 and the
    # matching jGui / Loom toolchain are released, and until then it must not fail the workflow.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      # The preprocessor walks the whole Minecraft version chain, so every JDK used by any
      # ancestor project has to be available: 8 (ReplayStudio / 1.16), 16 (1.17-1.18),
      # 17 (1.19-1.20), 21 (1.21+) and 25 (newer drops, if required).
      - name: Set up JDK 8
        id: jdk8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"

      - name: Set up JDK 16
        id: jdk16
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "16"

      - name: Set up JDK 17
        id: jdk17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up JDK 25
        id: jdk25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up JDK 21 (default)
        id: jdk21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build ${{ matrix.version }}
        env:
          # Parallel execution is disabled on purpose: the multi-version tooling resolves
          # configurations of other projects during task execution, which Gradle 9 only allows
          # in a single-threaded build ("resolution ... without an exclusive lock").
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.configureondemand=false -Dorg.gradle.caching=true -Dorg.gradle.java.installations.paths=${{ steps.jdk8.outputs.path }},${{ steps.jdk16.outputs.path }},${{ steps.jdk17.outputs.path }},${{ steps.jdk25.outputs.path }},${{ steps.jdk21.outputs.path }}"
          # "-" separated so values containing spaces survive as a single argument
          RECAP_GRADLE_ARGS: ${{ matrix.gradle_args }}
          RECAP_MC_RANGE: ${{ matrix.mc_range }}
        run: |
          set +e
          GRADLE_ARGS=()
          if [ -n "$RECAP_GRADLE_ARGS" ]; then
            IFS='|' read -r -a GRADLE_ARGS <<< "$RECAP_GRADLE_ARGS"
          fi
          echo "Extra Gradle arguments: ${GRADLE_ARGS[*]:-(none)}"
          status=1
          for attempt in 1 2 3; do
            echo "::group::Gradle attempt $attempt"
            ./gradlew :${{ matrix.version }}:bundleJar "${GRADLE_ARGS[@]}" --no-daemon --no-parallel --stacktrace 2>&1 | tee gradle.log
            status=${PIPESTATUS[0]}
            echo "::endgroup::"
            [ "$status" -eq 0 ] && break
            echo "::warning::Attempt $attempt for ${{ matrix.version }} failed (exit code $status)"
            sleep 20
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::Gradle build failed for ${{ matrix.version }} (exit code $status)"
            # javac/mixin errors first (file:line + symbol), then the Gradle failure block
            grep -E "\.java:[0-9]+: |^symbol:|^location:|cannot find symbol|Unresolved reference" gradle.log \
              | head -n 40 | sed 's/^/::error::/' || true
            { grep -m1 -A 35 "What went wrong" gradle.log || tail -n 35 gradle.log; } | sed 's/^/::error::/' | head -n 36 || true
          fi
          exit "$status"

      - name: Collect final jar (${{ matrix.version }})
        if: always()
        env:
          RECAP_MC_RANGE: ${{ matrix.mc_range }}
        run: |
          mkdir -p dist
          find "versions/${{ matrix.version }}/build/libs" -maxdepth 1 -name '*.jar' \
            ! -name '*-raw.jar' ! -name '*-obf.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' \
            -exec cp -v {} dist/ \; || true
          ls -l dist || true
          # patch level compatibility (e.g. the 1.21 jar also runs on 1.21.1)
          if [ -n "$RECAP_MC_RANGE" ] && [ "$RECAP_MC_RANGE" != "${{ matrix.version }}" ]; then
            python3 .github/scripts/set-mc-range.py "$RECAP_MC_RANGE" dist/*.jar
          fi

      - name: Upload jar (${{ matrix.version }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.jar
          if-no-files-found: warn
          retention-days: 30

  collect:
    name: Assemble single download
    needs: build
    if: always() && needs.build.result != 'skipped' && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all jars
        uses: actions/download-artifact@v4
        with:
          path: jars
          pattern: recapmod-*
          merge-multiple: true

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: recapmod
          path: jars/*.jar
          if-no-files-found: warn
          retention-days: 30

      - name: Assemble universal bundle
        run: |
          set -euo pipefail
          VERSION="$(head -n1 version.txt)"
          BUNDLE="recapmod-universal-${VERSION}"
          mkdir -p "stage/${BUNDLE}/META-INF/recap"
          for jar in jars/*.jar; do
            base="$(basename "$jar")"
            # recapmod-<minecraft>-<mod version>.jar -> <minecraft>
            mc="${base#recapmod-}"
            mc="${mc%-${VERSION}.jar}"
            mkdir -p "stage/${BUNDLE}/META-INF/recap/${mc}"
            cp "$jar" "stage/${BUNDLE}/META-INF/recap/${mc}/"
          done
          {
            echo "Recap Mod ${VERSION} - every supported Minecraft version in one file"
            echo
            echo "This jar is a distribution bundle, not a mod: Minecraft cannot load it directly."
            echo "Pick the jar for your Minecraft version from META-INF/recap/<minecraft>/ and drop it"
            echo "into your .minecraft/mods folder (Fabric)."
            echo
            echo "Contained Minecraft versions:"
            ls -1 "stage/${BUNDLE}/META-INF/recap" | sed 's/^/  - /'
          } > "stage/${BUNDLE}/INSTALL.txt"
          cp version.txt "stage/${BUNDLE}/VERSION.txt"
          (cd stage && jar --create --file "../${BUNDLE}.jar" -C . "${BUNDLE}")
          jar --list --file "${BUNDLE}.jar" | head -n 40
          ls -lh "${BUNDLE}.jar"

      - name: Upload universal bundle
        uses: actions/upload-artifact@v4
        with:
          name: recapmod-universal
          path: recapmod-universal-*.jar
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Release
    needs: [build, collect]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all jars
        uses: actions/download-artifact@v4
        with:
          path: jars
          pattern: recapmod-*
          merge-multiple: true

      - name: Download universal bundle
        uses: actions/download-artifact@v4
        with:
          name: recapmod-universal
          path: universal

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            jars/*.jar
            universal/*.jar
          generate_release_notes: true
          fail_on_unmatched_files: false
